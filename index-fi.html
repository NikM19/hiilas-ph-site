<!-- логика “Показать ещё” + безопасный пересчёт Isotope -->
<script>
(function(){
  const STEP = window.matchMedia('(max-width:600px)').matches ? 9 : 12;
  const items = Array.from(document.querySelectorAll('.iso-box'));
  const btn   = document.getElementById('load-more');

  function arrangeSafe(){
    if (!window.jQuery) return;
    var $wrap = jQuery('.iso-box-wrapper');
    if ($wrap.length && $wrap.data('isotope')) {
      $wrap.isotope('arrange');
    } else {
      jQuery(window).one('load', function(){
        var $w = jQuery('.iso-box-wrapper');
        if ($w.length && $w.data('isotope')) $w.isotope('arrange');
      });
    }
  }

  let shown = 0;
  function showMore(n = STEP){
    items.slice(shown, shown + n).forEach(el => el.classList.add('is-visible'));
    shown = Math.min(items.length, shown + n);
    if (btn && shown >= items.length) btn.hidden = true;
  }

  if (!items.length){ if (btn) btn.hidden = true; return; }

  showMore();      // показать первую партию
  arrangeSafe();   // пересчитать сетку

  btn && btn.addEventListener('click', function(){
    btn.classList.add('is-busy');
    showMore();
    arrangeSafe();
    setTimeout(() => btn.classList.remove('is-busy'), 350);
  });
})();
</script>
