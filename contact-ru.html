	<script>
		(function () {
			var openBtn = document.querySelector('.circle.inline');
			var closeBtn = document.querySelector('.close-iframe');
			var menu = document.getElementById('site-menu');
			if (!openBtn || !closeBtn || !menu) return;

			function openMenu() {
				menu.classList.add('reveal-modal');
				menu.setAttribute('aria-hidden', 'false');
				openBtn.setAttribute('aria-expanded', 'true');
				document.documentElement.classList.add('no-scroll');
				document.body.classList.add('no-scroll');
			}
			function closeMenu() {
				menu.classList.remove('reveal-modal');
				menu.setAttribute('aria-hidden', 'true');
				openBtn.setAttribute('aria-expanded', 'false');
				document.documentElement.classList.remove('no-scroll');
				document.body.classList.remove('no-scroll');
			}

			openBtn.addEventListener('click', openMenu);
			openBtn.addEventListener('keydown', function (e) {
				if (e.key === 'Enter' || e.key === ' ') {
					e.preventDefault(); openMenu();
				}
			});
			closeBtn.addEventListener('click', closeMenu);
			closeBtn.addEventListener('keydown', function (e) {
				if (e.key === 'Enter' || e.key === ' ') {
					e.preventDefault(); closeMenu();
				}
			});
		})();
	</script>

	<script>
		(function () {
			var form = document.getElementById('contact-form');
			if (!form) return;

			var fields = Array.prototype.slice.call(
				form.querySelectorAll('input[required], textarea[required]')
			);

			function paint(f) {
				f.classList.toggle('field-error', !f.validity.valid);
			}

			// Реакция без использования события 'invalid'
			fields.forEach(function (f) {
				f.addEventListener('input', function () { paint(f); }, { passive: true });
				f.addEventListener('blur', function () { paint(f); });
			});

			form.addEventListener('submit', function (e) {
				fields.forEach(paint);
				if (!form.checkValidity()) {
					e.preventDefault(); // просто не отправляем форму
				}
			});
		})();
	</script>
