  <!-- Показать ещё (точно как в index.html) -->
  <script>
  (function () {
    var btn   = document.getElementById('load-more');
    var items = Array.from(document.querySelectorAll('.iso-box'));
    if (!items.length) return;

    var STEP  = matchMedia('(max-width:600px)').matches ? 9 : 12;
    var shown = 0;

    function reveal(n){
      var slice = items.slice(shown, shown + n);
      slice.forEach(function(el){ el.classList.add('is-visible'); });
      shown += slice.length;
      if (btn && shown >= items.length) btn.hidden = true;
      return slice; // <— вернём показанную партию
    }

    function forceLayoutFor(slice){
      if (!window.jQuery) return;
      var $grid = jQuery('.iso-box-wrapper');
      if (!$grid.length || !$grid.data('isotope')) return;

      // перестроить под новый набор
      $grid.isotope('arrange', { filter: '.is-visible' });
      $grid.isotope('layout');

      // по мере загрузки/декодирования изображений — ещё разок
      jQuery(slice).imagesLoaded().progress(function(){
        if ($grid.data('isotope')) $grid.isotope('layout');
      });

      // маленькая подстраховка
      setTimeout(function(){
        if ($grid.data('isotope')) $grid.isotope('layout');
      }, 160);
    }

    // первая порция — сразу (чтобы custom.js увидел .is-visible)
    var first = reveal(STEP);
    // если isotope уже успел инициализироваться — перестроим сразу
    forceLayoutFor(first);

    // форсим быструю загрузку верхних картинок
    window.addEventListener('load', function(){
      var firstImgs = document.querySelectorAll('.iso-box.is-visible img');
      firstImgs.forEach(function(img, i){
        if (i < 6){
          img.loading = 'eager';
          img.decoding = 'sync';
          img.fetchPriority = 'high';
          var s = img.currentSrc || img.src; if (s) img.src = s;
        }
      });
    });

    // Кнопка «Показать ещё»
    if (btn){
      btn.addEventListener('click', function(){
        btn.classList.add('is-busy');
        var slice = reveal(STEP);
        forceLayoutFor(slice);               // <— на всякий случай дёргаем сами
        setTimeout(function(){ btn.classList.remove('is-busy'); }, 250);
      });
    }
  })();
  </script>

  <!-- Подстраховка лэйаута (как в index.html) -->
  <script>
  (function($){
    if (!window.jQuery) return;
    var $grid = jQuery('.iso-box-wrapper');
    if (!$grid.length) return;

    function relayoutCascade(){
      if (!$grid.data('isotope')) return;
      $grid.isotope('layout');
      requestAnimationFrame(function(){
        if ($grid.data('isotope')) $grid.isotope('layout');
      });
      setTimeout(function(){
        if ($grid.data('isotope')) $grid.isotope('layout');
      }, 180);
    }

    // после клика по любому фильтру — сделаем каскад
    jQuery(document).on('click', '.filter-wrapper a', function(){
      setTimeout(relayoutCascade, 0);
    });

    // если футер появился в зоне видимости — подстрахуемся
    var footer = document.querySelector('footer');
    if (footer && 'IntersectionObserver' in window){
      var io = new IntersectionObserver(function(entries){
        if (entries.some(function(e){ return e.isIntersecting; })) relayoutCascade();
      }, {rootMargin:'200px'});
      io.observe(footer);
    }
  })(jQuery);
  </script>

  <!-- Открытие/закрытие бургера (как в index.html) -->
  <script>
  (function(){
    var openBtn  = document.querySelector('.circle.inline');
    var closeBtn = document.querySelector('.close-iframe');
    var menu     = document.querySelector('.list-menu');
    if(!openBtn || !closeBtn || !menu) return;

    function openMenu(){
      menu.classList.add('reveal-modal');
      document.documentElement.classList.add('no-scroll');
      document.body.classList.add('no-scroll');
    }
    function closeMenu(){
      menu.classList.remove('reveal-modal');
      document.documentElement.classList.remove('no-scroll');
      document.body.classList.remove('no-scroll');
    }
    openBtn.addEventListener('click', openMenu);
    closeBtn.addEventListener('click', closeMenu);
  })();
  </script>
